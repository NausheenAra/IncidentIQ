# IncidentIQ backend: API + dashboard + detector loop, in the "incidentiq" namespace.
#
# Apply order (scripts/deploy_backend.sh does all of this):
#   1. k8s/rbac.yaml                      namespace, ServiceAccount, Role, RoleBinding
#   2. Secret "incidentiq-secrets"        created by the script from your local .env.
#                                         NEVER commit it, and it is deliberately not in this file.
#   3. k8s/backend.yaml                   this file
#
# Reach the dashboard at http://localhost:8080 (kind maps host 8080 -> NodePort 30080,
# see k8s/kind-config.yaml). The API is unauthenticated for reads in this demo, so the
# port is published on 127.0.0.1 only. Do not expose it beyond your machine.
apiVersion: v1
kind: ConfigMap
metadata:
  name: incidentiq-config
  namespace: incidentiq
  labels:
    app.kubernetes.io/part-of: incidentiq
data:
  APP_ENV: "production"                  # enforces a strong API_KEY and disables /docs
  LOG_LEVEL: "INFO"
  DATABASE_PATH: "/data/incidentiq.db"   # emptyDir: lost when the pod is recreated (demo only)
  KUBERNETES_NAMESPACE_ALLOWLIST: "default"
  DETECTOR_INTERVAL_SECONDS: "10"
  METRICS_INTERVAL_SECONDS: "5"          # live dashboard sampling of every connected cluster
  UNHEALTHY_POD_GRACE_SECONDS: "30"
  AUTO_REMEDIATE: "false"                # false = wait for an approval click in the dashboard
  ROLLBACK_MODE: "python"
  MAX_REMEDIATION_ATTEMPTS: "2"
  SCALE_TARGET_REPLICAS: "2"
  VERIFICATION_TIMEOUT_SECONDS: "120"
  VERIFICATION_INTERVAL_SECONDS: "5"
  INCIDENT_COOLDOWN_SECONDS: "60"
  INJECTION_MAX_AGE_SECONDS: "600"
  GEMINI_MODEL: "gemini-2.5-flash"
  GEMINI_TIMEOUT_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentiq-backend
  namespace: incidentiq
  labels:
    app.kubernetes.io/name: incidentiq-backend
    app.kubernetes.io/part-of: incidentiq
spec:
  # Exactly one replica, and Recreate (never RollingUpdate): every pod runs its own detector
  # loop and its own SQLite file, so two pods at once would double-handle incidents.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: incidentiq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentiq-backend
        app.kubernetes.io/part-of: incidentiq
    spec:
      serviceAccountName: incidentiq-backend
      automountServiceAccountToken: true      # required: in-cluster Kubernetes configuration
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: incidentiq-backend:local
          imagePullPolicy: IfNotPresent       # loaded into kind, never pulled
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: incidentiq-config
            - secretRef:
                name: incidentiq-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incidentiq-backend
  namespace: incidentiq
  labels:
    app.kubernetes.io/name: incidentiq-backend
    app.kubernetes.io/part-of: incidentiq
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: incidentiq-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080        # published to http://localhost:8080 by k8s/kind-config.yaml
